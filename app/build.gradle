plugins {
    id 'com.android.application'
}

android {
    namespace 'marto.rtl_tcp_andro'
    compileSdk 37

    defaultConfig {
        applicationId "marto.rtl_tcp_andro"
        minSdk 24
        targetSdk 37
        versionCode 32
        versionName "3.152"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (System.getenv("SIGNING_KEY")) {
                storeFile file("keystore.jks") // You'll need to place your keystore here locally
                storePassword System.getenv("KEY_STORE_PASSWORD")
                keyAlias System.getenv("ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("SIGNING_KEY")) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation project(path: ':sdrdrivertools')
    implementation project(path: ':hackrf')
    implementation project(path: ':rtlsdr')
}